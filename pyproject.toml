[project]
name = "eu-restaurant-ai-frontdesk"
version = "0.1.0"
description = "EU-focused AI front desk for restaurants"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "openai>=1.100,<2",
  "httpx>=0.28,<1",
  "twilio>=9.7,<10",
  "python-multipart>=0.0.20,<1",
  "jinja2>=3.1,<4",
  "python-dateutil>=2.9,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
